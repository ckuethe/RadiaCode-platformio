; ============================================================================
; PlatformIO Project Configuration for RadiaCode ESP-IDF Example
; ============================================================================
;
; This configuration file tells PlatformIO how to build your project.
; It specifies the board, framework, dependencies, and build options.
;
; For beginners: You need to add the RadiaCode library to lib_deps below.
; See the README.md for three different methods to add it.
;
; ============================================================================

; ----------------------------------------------------------------------------
; Global Settings
; ----------------------------------------------------------------------------

[platformio]
; This is the default environment that will be used when you run 'pio run'
default_envs = espidf-esp32

; ----------------------------------------------------------------------------
; Common Settings (shared by all environments)
; ----------------------------------------------------------------------------

[env]
platform = espressif32      ; ESP32 platform (supports all ESP32 variants)
monitor_speed = 115200      ; Serial monitor baud rate (must match code)
monitor_filters = 
    default                 ; Enable default filters
    ; colorize              ; Optional: colorize output (may not work on all terminals)

; Uncomment if you need to specify the upload port manually:
; upload_port = /dev/ttyUSB0    ; Linux/Mac
; upload_port = COM3             ; Windows

; Uncomment if you need to specify the monitor port manually:
; monitor_port = /dev/ttyUSB0   ; Linux/Mac
; monitor_port = COM3            ; Windows

; ----------------------------------------------------------------------------
; ESP-IDF Environment (Recommended)
; ----------------------------------------------------------------------------
; This environment uses pure ESP-IDF framework - no Arduino required!
; The library has been refactored to use standard C++ instead of Arduino APIs.

[env:espidf-esp32]
board = esp32dev            ; Change this to match your ESP32 board
                            ; Options: esp32dev, esp32-s2-saola-1, esp32-s3-devkitc-1, 
                            ;          nodemcu-32s, lolin32, etc.

framework = espidf          ; Pure ESP-IDF framework

; Dependencies - Libraries required for this project
lib_deps = 
    ; BLE library for ESP-IDF (provides NimBLE stack)
    h2zero/esp-nimble-cpp@^2.0.0
    
    ; RadiaCode library - Choose ONE of these methods:
    
    ; METHOD 1: From Git Repository (Recommended)
    ; Uncomment the line below to use this method:
    ; https://github.com/ckuethe/RadiaCode-platformio.git
    
    ; METHOD 2: From Local Path
    ; If you have the library downloaded locally, uncomment and modify:
    ; file:///home/user/path/to/RadiaCode-platformio
    
    ; METHOD 3: Copy to lib/ folder
    ; Copy the RadiaCode library to the lib/ folder in your project.
    ; No additional lib_deps entry needed for this method.

; Optional: Increase build verbosity for debugging
; build_flags = 
;     -DCORE_DEBUG_LEVEL=3    ; Enable ESP32 debug output (0-5, 5 is most verbose)

; Optional: ESP-IDF specific configuration
; board_build.partitions = partitions.csv  ; Custom partition table
; board_build.flash_mode = dio              ; Flash mode (qio, dio, qout, dout)

; ----------------------------------------------------------------------------
; Arduino Environment (For Comparison)
; ----------------------------------------------------------------------------
; This environment uses pure Arduino framework.
; Use this to compare ESP-IDF vs Arduino builds.

[env:arduino-esp32]
board = esp32dev            ; Change this to match your ESP32 board
framework = arduino         ; Pure Arduino framework (no ESP-IDF)

lib_deps = 
    ; Arduino framework includes BLE library, so we don't need esp-nimble-cpp
    
    ; RadiaCode library - Choose ONE method (same as above):
    ; https://github.com/ckuethe/RadiaCode-platformio.git
    ; file:///home/user/path/to/RadiaCode-platformio

; ----------------------------------------------------------------------------
; Additional Environment Examples
; ----------------------------------------------------------------------------
; You can create additional environments for different boards or configurations.

; Example: ESP32-S3 with ESP-IDF
; [env:espidf-esp32s3]
; board = esp32-s3-devkitc-1
; framework = espidf, arduino
; lib_deps = 
;     h2zero/esp-nimble-cpp@^2.0.0
;     https://github.com/ckuethe/RadiaCode-platformio.git

; Example: ESP32-C3 with ESP-IDF
; [env:espidf-esp32c3]
; board = esp32-c3-devkitm-1
; framework = espidf, arduino
; lib_deps = 
;     h2zero/esp-nimble-cpp@^2.0.0
;     https://github.com/ckuethe/RadiaCode-platformio.git

; ============================================================================
; Quick Reference Commands
; ============================================================================
;
; Build project:           pio run
; Build specific env:      pio run -e espidf-esp32
; Upload:                  pio run -t upload
; Monitor serial:          pio device monitor
; Build + Upload:          pio run -t upload && pio device monitor
; Clean build:             pio run -t clean
; Update libraries:        pio lib update
; Update platform:         pio platform update espressif32
;
; ============================================================================
