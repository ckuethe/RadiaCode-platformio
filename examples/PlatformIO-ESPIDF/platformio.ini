; PlatformIO Project Configuration File for ESP-IDF Framework
;
; This example demonstrates how to use the RadiaCode library with ESP-IDF framework.
; The library automatically uses esp-nimble-cpp for BLE communication when using ESP-IDF.
;
; Note: This library uses Arduino String class and other Arduino APIs. When using ESP-IDF,
; you need to include Arduino as an ESP-IDF component. PlatformIO automatically handles this
; when using framework-arduinoespressif32.
;
; Build profiles:
;   [env:espidf-esp32]    - ESP-IDF framework with ESP32 (includes Arduino as component)
;   [env:arduino-esp32]   - Arduino framework with ESP32 (for comparison)

[platformio]
default_envs = espidf-esp32

[env]
platform = espressif32
monitor_speed = 115200

[env:espidf-esp32]
board = esp32dev
framework = espidf, arduino
lib_deps = 
    h2zero/esp-nimble-cpp@^2.0.0

[env:arduino-esp32]
board = esp32dev
framework = arduino
